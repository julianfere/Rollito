services:
  rollito:
    build: .
    image: rollito:latest
    container_name: rollito
    restart: unless-stopped

    environment:
      PORT: 8087
      # Fijo, sin interpolar: es la ruta del volumen de acá abajo. Si se dejara
      # que un .env lo pisara con algo relativo, las subidas fallarían con
      # ENOENT sobre 'data/originals/...' y las fotos irían fuera del volumen.
      DATA_DIR: /data
      # Se definen en el Environment de Dokploy, o en un .env al lado de este
      # compose fuera de Dokploy (ver .env.example). Sin `:?` a propósito: esa
      # forma aborta el parseo del compose entero si la variable falta, y el
      # fallback que toma Dokploy termina ignorando el volumen de más abajo.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Opcionales: aviso al revelador cuando piden reabrir un rollo.
      NOTIFY_WEBHOOK: ${NOTIFY_WEBHOOK:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://rollito.local}

    ports:
      - "${HOST_PORT:-8087}:8087"

    # El proceso corre como `node` (uid 1000). Con un bind mount, el chown del
    # Dockerfile no aplica: manda el dueño de la carpeta del host. Si la carpeta
    # quedó de root, las subidas fallan con EACCES. Ajustá PUID/PGID al dueño
    # real (`id -u`), o dejá el default si esa carpeta ya es de uid 1000.
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # Los originales, las derivadas WebP, los zips y la base viven acá.
      #
      # Ruta absoluta del host y no una variable: si la variable no llega a
      # resolverse, compose no falla — Docker honra el `VOLUME /data` del
      # Dockerfile y crea un volumen ANÓNIMO, que se descarta al recrear el
      # contenedor. Así se perdieron los rollos dos veces. La ruta literal
      # hace imposible ese modo de falla silencioso.
      #
      # `files/` es la carpeta persistente que Dokploy mantiene por aplicación:
      # sobrevive al `git pull` que borra y reclona `code/` en cada deploy.
      # Si cambia el nombre del stack, hay que actualizar esta ruta.
      - /etc/dokploy/applications/rollito-rollito-c3pgo0/files/data:/data

    # La conversión con sharp es lo que más pega en una Raspberry Pi.
    # Este tope evita que el contenedor se coma la máquina entera.
    deploy:
      resources:
        limits:
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
