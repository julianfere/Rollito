<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rollo de 35mm, paleta Organic (fondo crema).
       Es la única pieza de la app con esta paleta: el resto sigue en el
       cuarto oscuro de tokens.css. -->
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#d68a52"/>
      <stop offset="55%" stop-color="#c67139"/>
      <stop offset="100%" stop-color="#a75a2a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="#f5ead8"/>

  <!-- lengüeta del carrete -->
  <rect x="26" y="12" width="10" height="8" rx="2.5" fill="#7a8a5e"/>

  <!-- cuerpo del canister -->
  <rect x="15" y="19" width="32" height="34" rx="11" fill="url(#cuerpo)"/>

  <!-- banda de película con perforaciones -->
  <rect x="15" y="30" width="32" height="12" fill="#f5ead8"/>
  <g fill="#c67139">
    <rect x="20" y="33.5" width="4" height="5" rx="1.2"/>
    <rect x="29" y="33.5" width="4" height="5" rx="1.2"/>
    <rect x="38" y="33.5" width="4" height="5" rx="1.2"/>
  </g>
</svg>
